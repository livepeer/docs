name: Issue Auto Label

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  auto-label:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue form and apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;
            const originalBody = issue.body || '';
            const originalTitle = issue.title || '';

            const indexMarker = '<!-- docs-v2-issue-indexer -->';
            const needsInfoMarker = '<!-- issue-intake-needs-info -->';
            const copilotAssignmentMarker = '<!-- issue-intake-copilot-assignment -->';
            const minorContractStart = '<!-- minor-docs-copilot-contract:start -->';
            const minorContractEnd = '<!-- minor-docs-copilot-contract:end -->';

            if (originalBody.includes(indexMarker)) {
              console.log(`Skipping auto-label for docs-v2 issue indexer (#${issue_number})`);
              return;
            }

            const managedPrefixes = ['area:', 'priority:', 'classification:', 'kind:', 'scope:'];

            const labelMeta = {
              'docs-v2': { color: '1d76db', description: 'Livepeer docs v2 issue scope' },
              'help wanted': { color: '008672', description: 'Community help requested' },
              'status: needs-triage': { color: 'fbca04', description: 'Needs initial maintainer triage' },
              'status: needs-info': { color: 'd4c5f9', description: 'More detail needed from reporter' },
              'type: bug': { color: 'd73a4a', description: 'Broken behavior or incorrect result' },
              'type: enhancement': { color: 'a2eeef', description: 'Improvement or new capability request' },
              'type: documentation': { color: '0075ca', description: 'Documentation issue or request' },
              'type: question': { color: 'd876e3', description: 'Question or clarification request' },
              'area: home-about': { color: '0e8a16', description: 'Home and About docs area' },
              'area: community': { color: '0e8a16', description: 'Community and contribution docs area' },
              'area: developers': { color: '0e8a16', description: 'Developer docs area' },
              'area: gateways': { color: '0e8a16', description: 'Gateway docs area' },
              'area: orchestrators': { color: '0e8a16', description: 'Orchestrator docs area' },
              'area: lpt-governance': { color: '0e8a16', description: 'LPT, delegation, governance, treasury docs area' },
              'area: resources': { color: '0e8a16', description: 'Resources and changelog docs area' },
              'area: ci-cd': { color: '0e8a16', description: 'Tooling and CI/CD area' },
              'area: structure': { color: '0e8a16', description: 'Repository structure area' },
              'area: multiple': { color: '0e8a16', description: 'Multiple documentation areas' },
              'priority: critical': { color: 'b60205', description: 'Critical priority' },
              'priority: high': { color: 'd93f0b', description: 'High priority' },
              'priority: medium': { color: 'fbca04', description: 'Medium priority' },
              'priority: low': { color: '0e8a16', description: 'Low priority' },
              'classification: urgent': { color: 'b60205', description: 'Urgent severity/impact classification' },
              'classification: high': { color: 'd93f0b', description: 'High severity/impact classification' },
              'classification: moderate': { color: 'fbca04', description: 'Moderate severity/impact classification' },
              'classification: minor': { color: '0e8a16', description: 'Minor severity/impact classification' },
              'kind: factual-error': { color: '5319e7', description: 'Docs page issue subtype: factual error' },
              'kind: unclear-instructions': { color: '5319e7', description: 'Docs page issue subtype: unclear instructions' },
              'kind: missing-context': { color: '5319e7', description: 'Docs page issue subtype: missing prerequisite or context' },
              'kind: broken-media-link': { color: '5319e7', description: 'Broken link, asset, or media issue' },
              'kind: accessibility-ux': { color: '5319e7', description: 'UX/readability/accessibility issue' },
              'kind: navigation-structure': { color: '5319e7', description: 'Structural/navigation issue' },
              'kind: spelling-copy': { color: '5319e7', description: 'Minor spelling, grammar, or copy issue' },
              'kind: formatting-markup': { color: '5319e7', description: 'Minor formatting or markup issue' },
              'kind: minor-docs': { color: '5319e7', description: 'Minor page-scoped docs issue' },
              'scope: page': { color: '1d76db', description: 'Issue scoped to a specific docs page' },
            };

            const subtypeToKind = {
              'factual error': 'kind: factual-error',
              'unclear instructions': 'kind: unclear-instructions',
              'missing prerequisite or context': 'kind: missing-context',
              'broken link or media': 'kind: broken-media-link',
              'ux, readability, or accessibility issue': 'kind: accessibility-ux',
              'structural or navigation issue': 'kind: navigation-structure',
            };

            const escapeRegex = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            const stripManagedBlock = (value, startMarker, endMarker) => {
              const text = String(value || '');
              const startIndex = text.indexOf(startMarker);
              if (startIndex === -1) return text;

              const endIndex = text.indexOf(endMarker, startIndex);
              const sliceEnd = endIndex === -1 ? text.length : endIndex + endMarker.length;
              const before = text.slice(0, startIndex).replace(/\s+$/, '');
              const after = text.slice(sliceEnd).replace(/^\s+/, '');

              if (!before) return after;
              if (!after) return before;
              return `${before}\n\n${after}`;
            };

            const sourceBody = stripManagedBlock(originalBody, minorContractStart, minorContractEnd);
            const parsedBody = sourceBody.trim();

            const getSection = (heading) => {
              const regex = new RegExp(`###\\s+${escapeRegex(heading)}\\s*\\n([\\s\\S]*?)(?=\\n###\\s+|$)`, 'i');
              const match = parsedBody.match(regex);
              return match ? match[1].trim() : '';
            };

            const hasSection = (heading) => new RegExp(`###\\s+${escapeRegex(heading)}\\s*\\n`, 'i').test(parsedBody);

            const normalize = (value) =>
              String(value || '')
                .replace(/\r/g, '')
                .replace(/^[-*]\s+/gm, '')
                .trim();

            const collapseWhitespace = (value) => normalize(value).replace(/\s+/g, ' ');

            const truncate = (value, max) => {
              const text = String(value || '');
              if (text.length <= max) return text;
              return `${text.slice(0, Math.max(0, max - 3)).trim()}...`;
            };

            const isPlaceholder = (value) => {
              const text = normalize(value).toLowerCase().replace(/[`*_]/g, '').trim();
              if (!text || text === '_no response_' || text === 'no response') return true;
              return ['n/a', 'na', 'tbd', 'none', 'unknown', '?'].includes(text);
            };

            const ensureLabel = async (name) => {
              const meta = labelMeta[name] || { color: 'ededed', description: 'Managed by issue auto-label workflow' };
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color: meta.color,
                    description: meta.description,
                  });
                } else {
                  throw error;
                }
              }
            };

            let cachedComments = null;
            const listComments = async () => {
              if (cachedComments) return cachedComments;
              cachedComments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              return cachedComments;
            };

            const upsertBotComment = async (marker, lines) => {
              const body = lines.join('\n');
              const comments = await listComments();
              const existing = comments.find(
                (comment) => comment.user?.type === 'Bot' && typeof comment.body === 'string' && comment.body.includes(marker)
              );

              if (existing) {
                if (existing.body !== body) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existing.id,
                    body,
                  });
                }
                return;
              }

              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              cachedComments = [...comments, created.data];
            };

            const normalizePageRef = (value) => {
              let text = collapseWhitespace(value)
                .replace(/^`+|`+$/g, '')
                .replace(/[),.;:]+$/g, '');

              if (!text) return '';
              if (/^docs\.livepeer\.org\//i.test(text)) {
                text = `https://${text}`;
              }

              if (/^https?:\/\//i.test(text)) {
                try {
                  const url = new URL(text);
                  text = url.pathname;
                } catch (_error) {
                  text = text.replace(/^https?:\/\/[^/]+/i, '');
                }
              }

              text = text.replace(/[?#].*$/, '');
              text = text.replace(/^\/+/, '');
              text = text.replace(/\/+$/, '');
              return text;
            };

            const inferAreaFromPage = (value) => {
              const page = normalizePageRef(value).toLowerCase();
              if (!page) return 'area: multiple';

              if (/^(v2\/)?home(\/|$)/.test(page) || page.includes('/about-livepeer/')) return 'area: home-about';
              if (/^(v2\/)?community(\/|$)/.test(page)) return 'area: community';
              if (/^(v2\/)?developers(\/|$)/.test(page)) return 'area: developers';
              if (/^(v2\/)?gateways(\/|$)/.test(page)) return 'area: gateways';
              if (/^(v2\/)?orchestrators(\/|$)/.test(page)) return 'area: orchestrators';
              if (/^(v2\/)?resources(\/|$)/.test(page)) return 'area: resources';
              if (/\b(lpt|governance|treasury|delegat(?:ion|or)?|bond|unbond)\b/.test(page)) return 'area: lpt-governance';
              return 'area: multiple';
            };

            const inferMinorKind = (issueText, evidenceText) => {
              const haystack = `${collapseWhitespace(issueText)}\n${collapseWhitespace(evidenceText)}`.toLowerCase();

              if (
                /\b(broken link|dead link|link returns|returns 404|404|href|anchor|missing image|broken image|missing asset|media|embed|image url|broken url)\b/.test(
                  haystack
                )
              ) {
                return 'kind: broken-media-link';
              }

              if (
                /\b(spelling|typo|misspell|grammar|copy issue|copy edit|punctuation|capitali[sz]ation|wording|incorrect text)\b/.test(
                  haystack
                )
              ) {
                return 'kind: spelling-copy';
              }

              if (
                /\b(format|formatting|markdown|mdx|markup|heading|table|bullet|list|code block|codeblock|whitespace|line break|render)\b/.test(
                  haystack
                )
              ) {
                return 'kind: formatting-markup';
              }

              return 'kind: minor-docs';
            };

            const makeTitle = (pageValue, issueValue) => {
              const pageLabel = truncate(normalizePageRef(pageValue) || collapseWhitespace(pageValue) || 'page', 72);
              const issueLabel = truncate(collapseWhitespace(issueValue), 110);
              return `[minor-docs] ${pageLabel}: ${issueLabel}`;
            };

            const contentCache = new Map();
            const repoPathExists = async (repoPath) => {
              if (!repoPath) return false;
              if (contentCache.has(repoPath)) return contentCache.get(repoPath);

              try {
                await github.rest.repos.getContent({ owner, repo, path: repoPath });
                contentCache.set(repoPath, true);
                return true;
              } catch (error) {
                if (error.status === 404) {
                  contentCache.set(repoPath, false);
                  return false;
                }
                throw error;
              }
            };

            const resolvePageFile = async (value) => {
              const page = normalizePageRef(value);
              if (!page) return '';

              const candidates = [];
              const pushCandidate = (candidate) => {
                const normalized = normalize(candidate);
                if (normalized && !candidates.includes(normalized)) {
                  candidates.push(normalized);
                }
              };

              pushCandidate(page);
              if (!page.endsWith('.mdx')) {
                pushCandidate(`${page}.mdx`);
              }
              pushCandidate(`${page}/index.mdx`);

              if (page.startsWith('v2/pages/')) {
                const trimmed = page.replace(/^v2\/pages\//, 'v2/');
                pushCandidate(trimmed);
                pushCandidate(`${trimmed}.mdx`);
                pushCandidate(`${trimmed}/index.mdx`);
              } else if (!page.startsWith('v2/')) {
                pushCandidate(`v2/${page}`);
                pushCandidate(`v2/${page}.mdx`);
                pushCandidate(`v2/${page}/index.mdx`);
              }

              for (const candidate of candidates) {
                if (await repoPathExists(candidate)) return candidate;
              }

              return '';
            };

            const buildMinorContract = ({ pageValue, resolvedPagePath, kindLabel }) => {
              const lines = [
                minorContractStart,
                '## Copilot execution contract (generated)',
                '',
                '- Base branch: `docs-v2`',
                '- Branch format: `codex/<issue-id>-<slug>`',
                '- Task contract: `.codex/task-contract.yaml`',
                '- PR creation: `node tools/scripts/create-codex-pr.js --create`',
                '- Required gate: `node tests/run-pr-checks.js --base-ref docs-v2`',
                '- Active docs scope: `v2/` and supporting `snippets/`; do not modify `v1/`.',
              ];

              if (resolvedPagePath) {
                lines.push(`- Resolved page file: \`${resolvedPagePath}\``);
              } else if (!isPlaceholder(pageValue)) {
                lines.push(`- Page reference: \`${collapseWhitespace(pageValue)}\``);
              }

              lines.push('', '### Suggested repair / validation commands');

              const suggested = [];
              if (kindLabel === 'kind: spelling-copy') {
                suggested.push('`node tools/scripts/remediators/content/repair-spelling.js --dry-run`');
              }
              if (kindLabel === 'kind: broken-media-link') {
                suggested.push(
                  resolvedPagePath
                    ? `\`node tests/integration/v2-link-audit.js --files ${resolvedPagePath} --strict\``
                    : '`node tests/integration/v2-link-audit.js --files <resolved-page-path> --strict`'
                );
              }

              if (suggested.length === 0) {
                lines.push('- Use the required gate above; no extra targeted command was inferred.');
              } else {
                suggested.forEach((command) => lines.push(`- ${command}`));
              }

              lines.push(minorContractEnd);
              return lines.join('\n');
            };

            const existingLabels = issue.labels.map((label) => (typeof label === 'string' ? label : label.name));
            const labelsSeen = new Set(existingLabels);
            const desiredManagedLabels = new Set();
            const hasClassificationSection = hasSection('Classification');

            let templateType = 'unknown';
            if (hasSection('Minor issue')) {
              templateType = 'minor_page_issue';
            } else if (hasSection('Issue subtype')) {
              templateType = 'docs_page_issue';
            } else if (hasSection('Steps to reproduce')) {
              templateType = 'bug_report';
            } else if (hasSection('Problem statement')) {
              templateType = 'feature_request';
            } else if (hasSection('Requested topic title')) {
              templateType = 'content_request';
            } else if (hasSection('Failing command or workflow')) {
              templateType = 'tooling_ci_issue';
            } else if (hasSection('Question')) {
              templateType = 'question_clarification';
            } else if (hasSection('Description') && hasClassificationSection && hasSection('Priority')) {
              templateType = 'feature_internal';
            }

            const commonBase = ['docs-v2', 'help wanted', 'status: needs-triage'];
            const templateBaseLabels = {
              bug_report: [...commonBase, 'type: bug'],
              docs_page_issue: [...commonBase, 'type: documentation', 'scope: page'],
              minor_page_issue: [...commonBase, 'type: documentation', 'scope: page'],
              feature_request: [...commonBase, 'type: enhancement'],
              feature_internal: [...commonBase, 'type: enhancement'],
              content_request: [...commonBase, 'type: documentation'],
              tooling_ci_issue: [...commonBase, 'type: bug', 'area: ci-cd'],
              question_clarification: [...commonBase, 'type: question'],
            };

            const baseLabels = templateBaseLabels[templateType] || commonBase;
            for (const label of baseLabels) {
              await ensureLabel(label);
            }

            const baseLabelsToAdd = baseLabels.filter((label) => !labelsSeen.has(label));
            if (baseLabelsToAdd.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: baseLabelsToAdd });
              baseLabelsToAdd.forEach((label) => labelsSeen.add(label));
            }

            const area = normalize(getSection('Area'));
            const classification = normalize(getSection('Classification'));
            const priority = normalize(getSection('Priority'));
            const issueSubtype = normalize(getSection('Issue subtype'));
            const pageInput =
              normalize(getSection('Page URL or file path')) || normalize(getSection('Affected page URL or file path'));
            const minorIssue = normalize(getSection('Minor issue'));
            const evidence = normalize(getSection('Evidence / exact broken text or URL')) || normalize(getSection('Evidence'));

            if (area.startsWith('area:')) desiredManagedLabels.add(area);
            if (classification.startsWith('classification:')) desiredManagedLabels.add(classification);
            if (priority.startsWith('priority:')) desiredManagedLabels.add(priority);

            if (templateType === 'docs_page_issue') {
              desiredManagedLabels.add('scope: page');
            }

            if (templateType === 'minor_page_issue') {
              desiredManagedLabels.add('scope: page');
              desiredManagedLabels.add('classification: minor');
              desiredManagedLabels.add('priority: low');
              desiredManagedLabels.add(inferAreaFromPage(pageInput));
              desiredManagedLabels.add(inferMinorKind(minorIssue, evidence));
            }

            const kindLabel = subtypeToKind[issueSubtype.toLowerCase()];
            if (kindLabel) {
              desiredManagedLabels.add(kindLabel);
            }

            if (templateType !== 'unknown') {
              const staleManaged = [...labelsSeen].filter(
                (name) => managedPrefixes.some((prefix) => name.startsWith(prefix)) && !desiredManagedLabels.has(name)
              );

              for (const label of staleManaged) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
                  labelsSeen.delete(label);
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }

            for (const label of desiredManagedLabels) {
              await ensureLabel(label);
            }

            const labelsToAdd = [...desiredManagedLabels].filter((label) => !labelsSeen.has(label));
            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: labelsToAdd });
              labelsToAdd.forEach((label) => labelsSeen.add(label));
            }

            let requiredSections = [];
            if (templateType === 'docs_page_issue') {
              requiredSections = [
                'Area',
                'Issue subtype',
                'Page URL or file path',
                'Section or anchor',
                'Exact problem statement',
                'Evidence',
                'UX/readability/accessibility feedback',
                'Suggested improvement',
                'Action requested from maintainers',
                'Done criteria / acceptance check',
                'Priority',
              ];
            } else if (templateType === 'minor_page_issue') {
              requiredSections = ['Page URL or file path', 'Minor issue'];
            } else if (templateType === 'bug_report') {
              requiredSections = [
                'Area',
                'Affected page URL or file path',
                'Steps to reproduce',
                'Actual result',
                'Expected result',
                'User impact',
                'Action requested from maintainers',
                'Priority',
              ];
            } else if (templateType === 'feature_request') {
              requiredSections = [
                'Area',
                'Problem statement',
                'Proposed solution',
                'User benefit',
                'Alternatives considered',
                'Action requested from maintainers',
                'Acceptance criteria / done criteria',
                'Priority',
              ];
            } else if (templateType === 'content_request') {
              requiredSections = [
                'Area',
                'Requested topic title',
                'Target audience',
                'Problem or use case',
                'Proposed outline',
                'Source references',
                'Action requested from maintainers',
                'Done criteria / acceptance check',
                'Priority',
              ];
            } else if (templateType === 'tooling_ci_issue') {
              requiredSections = [
                'Area',
                'Failing command or workflow',
                'Script or workflow path',
                'Full error output',
                'Reproduction conditions',
                'Expected behavior',
                'Action requested from maintainers',
                'Priority',
              ];
            } else if (templateType === 'question_clarification') {
              requiredSections = [
                'Area',
                'Relevant page URL or file path',
                'Question',
                'What you already checked',
                'Blocking impact',
                'Priority',
              ];
            } else if (templateType === 'feature_internal') {
              requiredSections = ['Description', 'Priority'];
            }

            if (hasClassificationSection && requiredSections.length > 0 && !requiredSections.includes('Classification')) {
              const priorityIndex = requiredSections.indexOf('Priority');
              if (priorityIndex >= 0) {
                requiredSections.splice(priorityIndex, 0, 'Classification');
              } else {
                requiredSections.push('Classification');
              }
            }

            const missingSections = requiredSections.filter((section) => isPlaceholder(getSection(section)));

            if (missingSections.length > 0) {
              await ensureLabel('status: needs-info');
              if (!labelsSeen.has('status: needs-info')) {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['status: needs-info'] });
                labelsSeen.add('status: needs-info');
              }

              const missingList = missingSections.map((section) => `- ${section}`).join('\n');
              await upsertBotComment(needsInfoMarker, [
                needsInfoMarker,
                'Thanks for opening this issue. A few required sections are missing or too vague for maintainers to act:',
                '',
                missingList,
                '',
                'Please edit the issue with concrete details (exact pages/paths, expected outcomes, and actionable requests). Once updated, maintainers can triage it quickly.',
              ]);
            } else if (labelsSeen.has('status: needs-info')) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'status: needs-info' });
                labelsSeen.delete('status: needs-info');
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (templateType === 'minor_page_issue') {
              const desiredTitle =
                !isPlaceholder(pageInput) && !isPlaceholder(minorIssue) ? makeTitle(pageInput, minorIssue) : '';
              const resolvedPagePath = !isPlaceholder(pageInput) ? await resolvePageFile(pageInput) : '';
              const minorKindLabel = [...desiredManagedLabels].find((label) => label.startsWith('kind:')) || 'kind: minor-docs';
              const desiredBody = `${sourceBody.replace(/\s+$/, '')}\n\n${buildMinorContract({
                pageValue: pageInput,
                resolvedPagePath,
                kindLabel: minorKindLabel,
              })}`.trim();

              const bodyChanged = desiredBody !== originalBody;
              const titleChanged = Boolean(desiredTitle) && desiredTitle !== originalTitle;
              if (bodyChanged || titleChanged) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number,
                  body: desiredBody,
                  ...(titleChanged ? { title: desiredTitle } : {}),
                });
              }

              const refreshedIssue = titleChanged || bodyChanged
                ? (await github.rest.issues.get({ owner, repo, issue_number })).data
                : issue;
              const assignees = (refreshedIssue.assignees || []).map((user) => user.login);

              if (!assignees.includes('copilot')) {
                try {
                  await github.rest.issues.addAssignees({
                    owner,
                    repo,
                    issue_number,
                    assignees: ['copilot'],
                  });
                } catch (error) {
                  await upsertBotComment(copilotAssignmentMarker, [
                    copilotAssignmentMarker,
                    'Automatic assignment to `@copilot` was attempted for this fast-track minor docs issue but did not succeed.',
                    '',
                    `GitHub response: ${error.status || 'error'} ${error.message || 'assignment failed'}`,
                    '',
                    'The issue remains valid and actionable; assign `@copilot` manually if repository permissions allow it.',
                  ]);
                }
              }
            } else if (sourceBody !== originalBody) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                body: sourceBody.trim(),
              });
            }
