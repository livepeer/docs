# @type      interface
# @concern   governance
# @niche     security
# @pipeline  P3 (PR), P5 (push)
# @policy    D-GOV-08
# @purpose   Block secrets from reaching the repo. Public repo + 18 secret-bearing env
#            vars in use → one accidental commit of a real key is harvested within
#            minutes. gitleaks scans diffs on every PR and every push to the long-lived
#            branches.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [docs-v2, docs-v2-dev, docs-v2-dev-draft]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source=/repo --redact --no-banner --verbose
