# type: interface
# concern: governance
# niche: security
# pipeline: composite
# policy: D-GOV-08
# purpose: Block secrets from reaching the repo. Public repo + 18 secret-bearing env
#          vars in use, so one accidental commit of a real key is harvested within
#          minutes. gitleaks scans diffs on every PR and every push to the long-lived
#          branches.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [docs-v2, docs-v2-dev, docs-v2-dev-draft]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        # gitleaks/gitleaks-action v2.3.9 — SHA-pinned
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
