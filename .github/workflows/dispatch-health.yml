# type: dispatch
# concern: health
# pipeline: composite (P3 + P5/P6 + manual)
# dispatch-health.yml
# Action workflow for the health concern. Four-tier dispatch architecture per D-ACT-08 + D-GOV-08.
# Calls meta dispatchers: dispatch-health-check.js (PR), dispatch-health-scan.js (scheduled), dispatch-health-repair.js (manual).
name: Health Pipeline

on:
  pull_request:
    paths:
      - "v2/**"
      - "snippets/**"
      - "operations/scripts/dispatch/content/health/**"
      - "operations/scripts/validators/content/**"
      - "operations/scripts/audits/content/**"
      - "operations/scripts/remediators/content/**"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode override (default = manual)"
        type: choice
        options: [pr, scheduled, manual]
        default: manual
      dry_run:
        description: "Preview without writes"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dispatch-health-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    name: Health · PR Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd tools && npm ci
      - name: Run health PR meta dispatcher
        env:
          NODE_PATH: tools/node_modules
        run: node operations/scripts/dispatch/content/health/dispatch-health-check.js --staged

  scheduled-monitor:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scheduled')
    name: Health · Scheduled Monitor
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.DEPLOY_BRANCH || 'docs-v2' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd tools && npm ci
      - name: Run health scheduled meta dispatcher
        env:
          NODE_PATH: tools/node_modules
        run: |
          # Cron defaults to write; manual dispatch can opt into dry-run via inputs.dry_run=true.
          # Cron triggers leave inputs.dry_run empty, so the previous default-to-dry-run pattern
          # silently broke scheduled writes. See docs-guide/features/automations.mdx § cron-is-dry-run.
          FLAGS="--write --verify"
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then FLAGS=""; fi
          node operations/scripts/dispatch/content/health/dispatch-health-scan.js $FLAGS

  manual-repair:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'manual'
    name: Health · Manual Repair
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd tools && npm ci
      - name: Run health manual repair meta dispatcher
        env:
          NODE_PATH: tools/node_modules
        run: |
          FLAGS=""
          if [[ "${{ inputs.dry_run }}" == "false" ]]; then FLAGS="--write --verify"; fi
          node operations/scripts/dispatch/content/health/dispatch-health-repair.js $FLAGS
      - name: Create PR if files changed
        if: ${{ inputs.dry_run == false }}
        # peter-evans/create-pull-request v7.0.8 — SHA-pinned (D-GOV-08, supply-chain hardening 2026-05-27)
        # To bump: look up the SHA for the new tag via `gh api repos/peter-evans/create-pull-request/git/refs/tags/<tag>`
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e
        with:
          title: "chore(health): manual repair sweep"
          commit-message: "chore(health): apply manual repair sweep [skip ci]"
          branch: chore/health-repair-${{ github.run_id }}
          labels: health, auto-generated, needs-review
          body: |
            Auto-generated by `dispatch-health-repair.js`. Review changes before merging.
